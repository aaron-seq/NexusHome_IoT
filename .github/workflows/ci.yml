name: CI

on:
  push:
    branches: [main, develop, 'fix/**', 'feat/**', 'feature/**', 'claude/**']
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOCKER_IMAGE: nexushome-iot

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # The solution is the canonical build entry point; building the web
      # project alone silently skips the test project.
      - name: Restore
        run: dotnet restore NexusHome.IoT.sln

      - name: Build
        run: dotnet build NexusHome.IoT.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test NexusHome.IoT.sln
          --configuration Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: ./coverage

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore NexusHome.IoT.sln

      # `dotnet list package --vulnerable` exits 0 even when it finds
      # advisories, so the output has to be inspected explicitly.
      - name: Fail on known vulnerable packages
        run: |
          dotnet list NexusHome.IoT.sln package --vulnerable --include-transitive \
            | tee vulnerabilities.txt
          if grep -qE '\s(Critical|High|Moderate)\s' vulnerabilities.txt; then
            echo "::error::Vulnerable NuGet packages detected"
            exit 1
          fi
          echo "No vulnerable packages found"

  docker-build:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the published entry point starts and serves liveness, which is
      # what the container health check depends on.
      - name: Smoke test the image
        run: |
          docker run -d --name nexushome-ci -p 8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e Database__Provider=Sqlite \
            -e ConnectionStrings__DefaultConnection="Data Source=/app/data/ci.db" \
            ${{ env.DOCKER_IMAGE }}:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health/live > /dev/null 2>&1; then
              echo "Application is live"
              docker rm -f nexushome-ci
              exit 0
            fi
            sleep 2
          done
          echo "::error::Application did not become healthy"
          docker logs nexushome-ci
          docker rm -f nexushome-ci
          exit 1

  security-scan:
    name: Filesystem security scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif

      - name: Upload results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
