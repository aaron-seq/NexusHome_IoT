<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexusHome IoT - Smart Home Dashboard</title>
    <meta
      name="description"
      content="NexusHome IoT Platform - Intelligent smart home management with real-time monitoring, energy optimization, and device automation."
    />
    <base href="/" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>"
    />
    <!-- Three.js for Spatial Context -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="NexusHome.Web.styles.css" />
  </head>

  <body>
    <div id="app">
      <!-- Loading screen while WASM loads -->
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          background: #0a0f1a;
          color: #f9fafb;
          font-family: &quot;Inter&quot;, sans-serif;
        "
      >
        <div
          style="
            width: 48px;
            height: 48px;
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
          "
        ></div>
        <p style="margin-top: 1.5rem; font-size: 1.125rem; font-weight: 500">
          Loading NexusHome...
        </p>
        <p style="margin-top: 0.5rem; font-size: 0.875rem; color: #6b7280">
          Initializing smart home dashboard
        </p>
      </div>
      <style>
        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>

    <div
      id="blazor-error-ui"
      style="
        display: none;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 1rem;
        background: #ef4444;
        color: white;
        text-align: center;
        z-index: 9999;
      "
    >
      An unhandled error has occurred.
      <a
        href=""
        class="reload"
        style="color: white; text-decoration: underline; margin-left: 0.5rem"
        >Reload</a
      >
      <a class="dismiss" style="cursor: pointer; margin-left: 1rem">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
  </body>
</html>
