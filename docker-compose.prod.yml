# Production overlay for the NexusHome IoT Platform.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Every secret is read from the environment. The application refuses to start
# outside Development unless JwtAuthentication__SecretKey is set.

services:
  nexushome-app:
    build: !reset null
    image: ${NEXUSHOME_IMAGE:-nexushome-iot:latest}
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Database__Provider=SqlServer
      - Security__UseHttpsRedirection=false
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 512M

  sqlserver:
    environment:
      - MSSQL_PID=Standard
    # The database port stays on the internal network in production.
    ports: !reset []

  redis:
    ports: !reset []

  mqtt-broker:
    ports:
      - "1883:1883"
